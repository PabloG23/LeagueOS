<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeagueOS - Plataforma de Gestión Deportiva</title>
    <meta name="description" content="Consulta estadísticas, tabla de posiciones, rol de juegos y resultados en vivo." />

    <!-- OpenGraph / WhatsApp / Facebook Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LeagueOS" />
    <meta property="og:title" content="LeagueOS - Plataforma de Gestión Deportiva" />
    <meta property="og:description" content="Consulta estadísticas, tabla de posiciones, rol de juegos y resultados en vivo." />
    <meta property="og:image" content="https://league-os-weld.vercel.app/league_logo_new.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LeagueOS - Plataforma de Gestión Deportiva" />
    <meta name="twitter:description" content="Consulta estadísticas, tabla de posiciones, rol de juegos y resultados en vivo." />
    <meta name="twitter:image" content="https://league-os-weld.vercel.app/league_logo_new.png" />

    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        var host = window.location.hostname.toLowerCase();
        var isSanLucas = path.indexOf('sanlucas') !== -1;
        var isNuestroDeporte = host.indexOf('nuestrodeporte') !== -1 || path.indexOf('nuestrodeporte') !== -1;

        var title = 'LeagueOS - Plataforma de Gestión Deportiva';
        var desc = 'Consulta estadísticas, rol de juegos, tabla de posiciones y resultados en vivo.';
        var siteName = 'LeagueOS';
        var iconUrl = '/league_logo_new.png';

        if (isSanLucas) {
          title = 'Liga Ejidal de Futbol San Sebastian y San Lucas - Portal Oficial';
          desc = 'Portal Oficial de la Liga Ejidal de Futbol San Sebastian y San Lucas. Uniendo tradición y pasión en cada encuentro deportivo.';
          siteName = 'Liga San Lucas';
          iconUrl = '/san_lucas_logo.png';
        } else if (isNuestroDeporte) {
          title = 'Liga Nuestro Deporte - Portal Oficial';
          desc = 'Portal Oficial de Liga Nuestro Deporte. Desde 1985.';
          siteName = 'Liga Nuestro Deporte';
          iconUrl = '/nuestro_deporte_logo.png';
        }

        document.title = title;

        var link = document.querySelector("link[rel~='icon']") || document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/png';
        link.href = iconUrl;
        document.head.appendChild(link);

        var fullImageUrl = window.location.origin + iconUrl;

        // Update OpenGraph meta tags dynamically
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', title);
        var ogSiteName = document.querySelector('meta[property="og:site_name"]');
        if (ogSiteName) ogSiteName.setAttribute('content', siteName);
        var ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute('content', desc);
        var ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage) ogImage.setAttribute('content', fullImageUrl);

        // Update Twitter meta tags dynamically
        var twTitle = document.querySelector('meta[name="twitter:title"]');
        if (twTitle) twTitle.setAttribute('content', title);
        var twDesc = document.querySelector('meta[name="twitter:description"]');
        if (twDesc) twDesc.setAttribute('content', desc);
        var twImage = document.querySelector('meta[name="twitter:image"]');
        if (twImage) twImage.setAttribute('content', fullImageUrl);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
