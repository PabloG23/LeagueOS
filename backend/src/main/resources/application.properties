spring.profiles.active=dev
app.environment=${APP_ENV:dev}

# Server Configuration
server.port=8080
server.error.include-message=always
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/leagueos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:leagueos_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# CORS
app.cors.allowed-origins=http://localhost:5173,https://league-os-weld.vercel.app,https://nuestrodeporte.com,https://www.nuestrodeporte.com

# Cloudflare R2
cloudflare.r2.account-id=${CF_R2_ACCOUNT_ID:dummy-account-id}
cloudflare.r2.access-key=${CF_R2_ACCESS_KEY:dummy-access-key}
cloudflare.r2.secret-key=${CF_R2_SECRET_KEY:dummy-secret-key}
cloudflare.r2.bucket=${CF_R2_BUCKET:leagueos-media}
cloudflare.r2.endpoint=https://${cloudflare.r2.account-id}.r2.cloudflarestorage.com

# Gemini AI
gemini.api-key=${GEMINI_API_KEY:dummy-gemini-key}
gemini.model=gemini-flash-latest

# JWT Security
app.jwt.secret=${APP_JWT_SECRET:LocalDevSecretKeyMustBeLongEnoughForHS512AlgorithmRequirementsLocalDevOnly}
