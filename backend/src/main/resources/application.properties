spring.profiles.active=dev
app.environment=${APP_ENV:dev}

# Server Configuration
server.port=8080
server.error.include-message=always
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/leagueos
spring.datasource.username=leagueos_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# CORS
app.cors.allowed-origins=http://localhost:5173,https://league-os-weld.vercel.app,https://nuestrodeporte.com,https://www.nuestrodeporte.com

# Cloudflare R2
cloudflare.r2.account-id=${CF_R2_ACCOUNT_ID:ba60a03d4636af7de0ef46272d8a5811}
cloudflare.r2.access-key=${CF_R2_ACCESS_KEY:bea8a112f7bf9aa92266d39c747df25e}
cloudflare.r2.secret-key=${CF_R2_SECRET_KEY:6588b7139c74c771c6335b6d7dcc3dca30cb679d2cfe68ea114c631402eb4026}
cloudflare.r2.bucket=leagueos-media
